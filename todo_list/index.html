<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List ⭐⭐⭐</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --primary-color: #5c6bc0;
            --delete-color: #ef5350;
            --done-color: #81c784;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .todo-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

     
        button.add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button.add-btn:hover {
            background-color: goldenrod;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s;
        }

        li.completed {
            border-left-color: var(--done-color);
            background-color: #edf7ed;
        }

        li.completed .todo-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }

        .todo-text {
            font-size: 16px;
            word-break: break-all;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--delete-color);
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            transition: transform 0.2s;
        }

        .delete-btn:hover {
            transform: scale(1.2);
        }
         .btn-sua {
            background: orange;
            color: black;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
        .btn-sua:hover{
            transform: scale(1.);
        }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>Todo List ⭐⭐⭐</h2>
    
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Thêm công việc mới...">
        <button class="add-btn" id="btn-them">Thêm</button>
    </div>

    <ul id="todo-list"></ul>

</div>
<input type="checkbox">
<script src="todo.js"></script>

</body>
</html>
