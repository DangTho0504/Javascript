<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 700px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            color: white;
            background: green;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        table,
        th,
        td {
            border: 1px solid gray;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        th {
            background: #ddd;
        }

        .btn-sua {
            background: orange;
            color: black;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }

        .btn-xoa {
            background: red;
            color: white;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>🎓 Quản Lý Sinh Viên</h2>

        <div class="form-group">
            <label>Mã sinh viên</label>
            <input type="text" id="maSV">
        </div>

        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="hoTen">
        </div>

        <div class="form-group">
            <label>Lớp</label>
            <input type="text" id="lop">
        </div>

        <div class="form-group">
            <label>Điểm trung bình</label>
            <input type="number" id="diem" min="0" max="10" step="0.1">
        </div>

        <button id="btnThem">
            Thêm Sinh Viên
        </button>

        <table>

            <thead>

                <tr>

                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>Lớp</th>
                    <th>Điểm</th>
                    <th>Xếp loại</th>
                    <th>Hành động</th>

                </tr>

            </thead>

            <tbody id="danhSachSinhVien">

            </tbody>

        </table>

    </div>

    <script src="code.js"></script>

</body>

</html>
