<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Components</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card calculator">
            <h2>🧮 Calculator</h2>
            <input type="text" id="calc-display" readonly placeholder="0">
            <div class="calc-buttons">
                <button onclick="clearDisplay()" class="btn-clear">C</button>
                <button onclick="appendValue('/')">/</button>
                <button onclick="appendValue('*')">*</button>
                <button onclick="appendValue('-')">-</button>
                
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('+')">+</button>
                
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="calculateResult()" class="btn-equal">=</button>
                
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="appendValue('0')">0</button>
            </div>
        </div>

        <div class="card todo">
            <h2>📝 To-Do List</h2>
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="Add a new task...">
                <button id="todo-add-btn">Add</button>
            </div>
            <ul id="todo-list"></ul>
        </div>

        <div class="card modal-trigger-zone">
            <h2>🪟 Modal Popup</h2>
            <button id="open-modal-btn">Open Modal</button>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="close-modal-btn">&times;</span>
            <h3>Hello there! 👋</h3>
            <p>This is an interactive modal window triggered smoothly by JavaScript.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
