<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm</title>
    <style>
        * {
            box-sizing: border-box; /* Lệnh giải cứu thế giới */
            font-family: Arial, sans-serif;
        }
        body {
            background: #f4f6f9;
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 600px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-main {
            width: 100%; padding: 12px; background: #28a745; color: white;
            border: none; font-size: 16px; font-weight: bold; cursor: pointer;
            border-radius: 4px; margin-top: 10px;
        }
        
        /* Style cho Bảng Sản Phẩm */
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        
        .btn-xoa { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .error-text { color: red; font-size: 14px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📦 Quản Lý Sản Phẩm</h2>
        
        <div class="form-group">
            <label>Tên sản phẩm</label>
            <input type="text" id="inputTen">
            <span id="loiTen" class="error-text"></span>
        </div>
        
        <div class="form-group">
            <label>Giá (VNĐ)</label>
            <input type="number" id="inputGia">
            <span id="loiGia" class="error-text"></span>
        </div>
        
        <div class="form-group">
            <label>Số lượng</label>
            <input type="number" id="inputSoLuong">
            <span id="loiSoLuong" class="error-text"></span>
        </div>

        <button id="btnThem" class="btn-main">Thêm Sản Phẩm</button>

        <table>
            <thead>
                <tr>
                    <th>Tên SP</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Tổng tiền</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="danh-sach-sp">
                </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
