<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính 2 Số</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            font-size: 20px;
            cursor: pointer;
        }

        .ketqua {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>🧮 Máy Tính 2 Số</h2>

        <div class="form-group">
            <label for="inputA">Số a</label>
            <input type="number" id="inputA">
        </div>

        <div class="form-group">
            <label for="inputB">Số b</label>
            <input type="number" id="inputB">
        </div>

        <div class="button-group">

            <button id="btnCong">+</button>

            <button id="btnTru">-</button>

            <button id="btnNhan">*</button>

            <button id="btnChia">/</button>

        </div>

        <div class="ketqua">

            Kết quả:

            <span id="ketQua">0</span>

        </div>

    </div>

    <script src="may_tinh.js"></script>

</body>

</html>
